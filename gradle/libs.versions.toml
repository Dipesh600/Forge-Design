[versions]
agp                 = "8.13.2"
kotlin              = "2.0.21"
ksp                 = "2.0.21-1.0.27"
hilt                = "2.51.1"

# AndroidX
coreKtx             = "1.16.0"
appcompat           = "1.7.1"
activity            = "1.10.1"
fragment            = "1.8.8"
lifecycle           = "2.9.0"
navigation          = "2.9.0"
room                = "2.7.1"
datastore           = "1.1.4"
constraintlayout    = "2.2.1"
recyclerview        = "1.4.0"
viewpager2          = "1.1.0"

# Material
material            = "1.13.0"

# Networking
retrofit            = "2.11.0"
okhttp              = "4.12.0"
gson                = "2.11.0"

# Coroutines
coroutines          = "1.10.1"

# Firebase
firebaseBom         = "33.14.0"

# Testing
junit               = "4.13.2"
junitVersion        = "1.2.1"
espressoCore        = "3.6.1"
firebaseAuth = "24.0.1"
credentials = "1.6.0"
credentialsPlayServicesAuth = "1.6.0"
googleid = "1.2.0"

[libraries]
# AndroidX Core
androidx-core-ktx              = { group = "androidx.core",     name = "core-ktx",                  version.ref = "coreKtx" }
androidx-appcompat             = { group = "androidx.appcompat", name = "appcompat",                 version.ref = "appcompat" }
androidx-activity-ktx          = { group = "androidx.activity",  name = "activity-ktx",              version.ref = "activity" }
androidx-fragment-ktx          = { group = "androidx.fragment",  name = "fragment-ktx",              version.ref = "fragment" }
androidx-constraintlayout      = { group = "androidx.constraintlayout", name = "constraintlayout",   version.ref = "constraintlayout" }
androidx-recyclerview          = { group = "androidx.recyclerview", name = "recyclerview",            version.ref = "recyclerview" }

# Material Design 3
material                       = { group = "com.google.android.material", name = "material",         version.ref = "material" }

# Lifecycle
androidx-lifecycle-viewmodel   = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx",   version.ref = "lifecycle" }
androidx-lifecycle-runtime     = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",     version.ref = "lifecycle" }

# Navigation
androidx-navigation-fragment   = { group = "androidx.navigation", name = "navigation-fragment-ktx",  version.ref = "navigation" }
androidx-navigation-ui         = { group = "androidx.navigation", name = "navigation-ui-ktx",        version.ref = "navigation" }

# Room
androidx-room-runtime          = { group = "androidx.room",      name = "room-runtime",              version.ref = "room" }
androidx-room-ktx              = { group = "androidx.room",      name = "room-ktx",                  version.ref = "room" }
androidx-room-compiler         = { group = "androidx.room",      name = "room-compiler",             version.ref = "room" }

# DataStore
androidx-datastore-prefs       = { group = "androidx.datastore", name = "datastore-preferences",     version.ref = "datastore" }

# Coroutines
kotlinx-coroutines-android     = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Retrofit + OkHttp
retrofit                       = { group = "com.squareup.retrofit2", name = "retrofit",              version.ref = "retrofit" }
retrofit-converter-gson        = { group = "com.squareup.retrofit2", name = "converter-gson",        version.ref = "retrofit" }
okhttp-bom                     = { group = "com.squareup.okhttp3",   name = "okhttp-bom",            version.ref = "okhttp" }
okhttp                         = { group = "com.squareup.okhttp3",   name = "okhttp" }
okhttp-logging                 = { group = "com.squareup.okhttp3",   name = "logging-interceptor" }
gson                           = { group = "com.google.code.gson",   name = "gson",                   version.ref = "gson" }

# Hilt
hilt-android                   = { group = "com.google.dagger",  name = "hilt-android",              version.ref = "hilt" }
hilt-compiler                  = { group = "com.google.dagger",  name = "hilt-android-compiler",     version.ref = "hilt" }

# Firebase
firebase-bom                   = { group = "com.google.firebase", name = "firebase-bom",             version.ref = "firebaseBom" }
firebase-auth-ktx              = { group = "com.google.firebase", name = "firebase-auth-ktx" }
firebase-firestore-ktx         = { group = "com.google.firebase", name = "firebase-firestore-ktx" }
firebase-functions-ktx         = { group = "com.google.firebase", name = "firebase-functions-ktx" }
firebase-analytics-ktx         = { group = "com.google.firebase", name = "firebase-analytics-ktx" }
firebase-storage-ktx           = { group = "com.google.firebase", name = "firebase-storage-ktx" }

# Testing
junit                          = { group = "junit",               name = "junit",                     version.ref = "junit" }
androidx-junit                 = { group = "androidx.test.ext",   name = "junit",                     version.ref = "junitVersion" }
androidx-espresso-core         = { group = "androidx.test.espresso", name = "espresso-core",          version.ref = "espressoCore" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth", version.ref = "firebaseAuth" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentialsPlayServicesAuth" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

[plugins]
android-application            = { id = "com.android.application",            version.ref = "agp" }
kotlin-android                 = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-ksp                     = { id = "com.google.devtools.ksp",             version.ref = "ksp" }
hilt-android                   = { id = "com.google.dagger.hilt.android",      version.ref = "hilt" }
google-services                = { id = "com.google.gms.google-services",      version = "4.4.2" }
kotlin-parcelize               = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
